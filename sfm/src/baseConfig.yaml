# ============================================================================
# sfm baseConfig.yaml — 二改版
#
# 原模块：神秘啊神秘 / SingBox_For_Magisk
# 原作者：Puer_Nya  https://github.com/PuerNya
# 基于原版：version=202408160739 / versionCode=8
#
# 二改：SyntaxJester  https://github.com/SyntaxJester/sfm-tweaked
# 本版本：version=202608310745 / versionCode=10
# 改动详情见 docs/CHANGES.md
#
# 注意：本文件是面板的工作缓存，面板每次保存配置都会重写它（含删除本注释）。
#       替换前请先 pkill -f 'node /data/adb/sfm/bundle'。
# ============================================================================
log:
  disabled: false
  level: error
  output: ./src/log/box.log
  timestamp: true
dns:
  fakeip:
    enabled: true
    inet4_range: 28.0.0.0/8
    inet6_range: fc00::/18
    exclude_rule:
      domain_keyword:
        - stun
        - ntp
        - time
      domain_suffix:
        - .market.xiaomi.com
        - .msftncsi.com
        - .msftconnecttest.com
        - .wotgame.cn
        - .wggames.cn
        - .wowsgame.cn
        - .wargaming.net
        - .steamcontent.com
        - .local
        - .lan
        - .home
        - .home.arpa
        - .internal
        - .localdomain
        - .arpa
  hosts:
    dns.pub:
      - 1.12.12.12
      - 120.53.53.53
    pod.dns:
      - 119.29.29.29
      - '2402:4e00::'
    114.dns:
      - 114.114.114.114
      - 114.114.115.115
    byte.dns:
      - 180.184.1.1
      - 180.184.2.2
    router.dns:
      - 192.168.0.1
      - 192.168.1.1
      - 192.168.31.1
    dns.alidns.com:
      - 223.5.5.5
      - 223.6.6.6
      - 2400:3200::1
      - 2400:3200:baba::1
    dns.google:
      - 8.8.4.4
      - 8.8.8.8
      - 2001:4860:4860::8844
      - 2001:4860:4860::8888
    dns.quad9.net:
      - 9.9.9.9
      - 149.112.112.112
      - 2620:fe::9
      - 2620:fe::fe
    one.one.one.one:
      - 1.0.0.1
      - 1.1.1.1
      - 2606:4700:4700::1001
      - 2606:4700:4700::1111
    unfiltered.adguard-dns.com:
      - 94.140.14.140
      - 94.140.14.141
      - 2a10:50c0::1:ff
      - 2a10:50c0::2:ff
  servers:
    - tag: direct-dns
      address:
        - 114.dns
        - pod.dns
        - byte.dns
        - dns.alidns.com
      detour: 本机直连
    - tag: domestic-dns
      address:
        - https://dns.pub/dns-query
        - https://dns.alidns.com/dns-query
      detour: 国内出口
    - tag: proxy-nm
      address:
        - tcp://dns.google
        - tcp://dns.quad9.net
        - tcp://one.one.one.one
        - tcp://unfiltered.adguard-dns.com
      detour: 国外出口
    - tag: proxy-ml
      address:
        - https://dns.google/dns-query
        - https://dns.quad9.net/dns-query
        - https://one.one.one.one/dns-query
        - https://unfiltered.adguard-dns.com/dns-query
      detour: 国外出口
    - tag: global-dns
      address:
        - https://dns.google/dns-query
        - https://dns.quad9.net/dns-query
        - https://one.one.one.one/dns-query
        - https://unfiltered.adguard-dns.com/dns-query
      detour: 全局代理
    - tag: outbound-unknown
      address:
        - https://dns.pub/dns-query
        - https://dns.alidns.com/dns-query
      detour: 大厂羊毛
    - tag: router-dns
      address: router.dns
      detour: 本机直连
      notice: 路由后台/局域网域名交给网关自己解析
    - tag: fakedns
      address: fakeip
      notice: fakeip 专用 DNS 服务器
    - tag: nxdomain
      address: rcode://success
      notice: 对域名解析返回空解析
  rules:
    - outbound:
        - 本机直连
        - OUTBOUNDLESS
        - 大厂羊毛
      server: direct-dns
      notice: 直连域名解析规则
    - outbound: any
      server: outbound-unknown
      notice: 出站域名解析规则
    - rule_set: 广告拦截
      server: nxdomain
      rewrite_ttl: 0
      disable_cache: true
    - rule_set:
        - HTTPDNS-域名
        - HTTPDNS-大陆-域名
        - 虎牙-PCDN｜MCDN-域名
        - 哔哩哔哩-PCDN｜MCDN-域名
      server: nxdomain
      disable_cache: true
      notice: HTTPDNS 与 PCDN/MCDN 返回空解析，迫使客户端回落到本机 DNS
    - domain_suffix:
        - .lan
        - .local
        - .home
        - .home.arpa
        - .internal
        - .localdomain
        - .arpa
      server: router-dns
      notice: >-
        只有「内网专用后缀」才交给网关 DNS。若你的网关不是 192.168.0.1 / 1.1 / 31.1，
        请改 dns.hosts 里的 router.dns，否则这些域名解析会超时（不影响其它域名）。
    - rule_set:
        - 路由后台-域名
        - 私有网络-域名
      server: direct-dns
      notice: >-
        路由后台/NAS/面板域名（miwifi.com、tplogin.cn、asusrouter.com 之类是真实公网域名）
        走直连 DNS 解析，解析出的内网 IP 会被 route 里的「保留地址直连」送去直连
    - rule_set: NTP-域名
      server: direct-dns
      rewrite_ttl: 30
      notice: 时间同步必须拿到真实 IP，不能进 fakeip
    - clash_mode:
        - 全局直连-FakeIP
        - 全局代理-FakeIP
        - 规则模式-我不免流-FakeIP
        - 规则模式-我要免流-FakeIP
      query_type:
        - A
        - AAAA
      server: fakedns
      rewrite_ttl: 0
      disable_cache: true
    - clash_mode:
        - 全局直连-RedirHost
        - 全局直连-FakeIP
      server: direct-dns
    - clash_mode:
        - 全局代理-RedirHost
        - 全局代理-FakeIP
      server: global-dns
    - clash_mode:
        - 规则模式-我不免流-混合模式
        - 规则模式-我要免流-混合模式
      query_type:
        - A
        - AAAA
      rule_set:
        - tiktok-域名
        - 强制代理-域名
        - 大陆相关-海外服务-域名
        - 腾讯-海外服务-域名
        - 阿里巴巴-海外服务-域名
        - 字节跳动-海外服务-域名
        - 哔哩哔哩-海外服务-域名
        - AI服务-域名
        - IP归属检测-域名
      server: fakedns
      rewrite_ttl: 0
      disable_cache: true
    - clash_mode:
        - 规则模式-我不免流-RedirHost
        - 规则模式-我不免流-FakeIP
        - 规则模式-我不免流-混合模式
      rule_set:
        - tiktok-域名
        - 强制代理-域名
        - 大陆相关-海外服务-域名
        - 腾讯-海外服务-域名
        - 阿里巴巴-海外服务-域名
        - 字节跳动-海外服务-域名
        - 哔哩哔哩-海外服务-域名
        - AI服务-域名
        - IP归属检测-域名
      server: proxy-nm
    - clash_mode:
        - 规则模式-我要免流-RedirHost
        - 规则模式-我要免流-FakeIP
        - 规则模式-我要免流-混合模式
      rule_set:
        - tiktok-域名
        - 强制代理-域名
        - 大陆相关-海外服务-域名
        - 腾讯-海外服务-域名
        - 阿里巴巴-海外服务-域名
        - 字节跳动-海外服务-域名
        - 哔哩哔哩-海外服务-域名
        - AI服务-域名
        - IP归属检测-域名
      server: proxy-ml
    - clash_mode:
        - 规则模式-我不免流-RedirHost
        - 规则模式-我不免流-FakeIP
        - 规则模式-我不免流-混合模式
      rule_set:
        - 推送服务-域名
        - 强制直连-域名
        - 字节跳动-域名
        - 大陆相关-域名
        - 海外公司-大陆服务-域名
        - 苹果-域名
        - 谷歌-大陆服务-域名
        - 微软-大陆服务-域名
        - 亚马逊-大陆服务-域名
        - 海外CDN-大陆服务-域名
        - 游戏平台-大陆服务-域名
        - 哔哩哔哩-域名
        - 哔哩哔哩2-域名
      server: direct-dns
    - clash_mode:
        - 规则模式-我要免流-RedirHost
        - 规则模式-我要免流-FakeIP
        - 规则模式-我要免流-混合模式
      rule_set:
        - 推送服务-域名
        - 强制直连-域名
        - 字节跳动-域名
        - 大陆相关-域名
        - 海外公司-大陆服务-域名
        - 苹果-域名
        - 谷歌-大陆服务-域名
        - 微软-大陆服务-域名
        - 亚马逊-大陆服务-域名
        - 海外CDN-大陆服务-域名
        - 游戏平台-大陆服务-域名
        - 哔哩哔哩-域名
        - 哔哩哔哩2-域名
      server: domestic-dns
    - clash_mode:
        - 规则模式-我不免流-混合模式
        - 规则模式-我要免流-混合模式
      query_type:
        - A
        - AAAA
      rule_set: 海外公司-域名
      server: fakedns
      rewrite_ttl: 0
      disable_cache: true
    - clash_mode:
        - 规则模式-我不免流-RedirHost
        - 规则模式-我不免流-FakeIP
        - 规则模式-我不免流-混合模式
      rule_set: 海外公司-域名
      server: proxy-nm
    - clash_mode:
        - 规则模式-我要免流-RedirHost
        - 规则模式-我要免流-FakeIP
        - 规则模式-我要免流-混合模式
      rule_set: 海外公司-域名
      server: proxy-ml
    - clash_mode:
        - 规则模式-我不免流-混合模式
        - 规则模式-我不免流-RedirHost
        - 规则模式-我不免流-FakeIP
      fallback_rules:
        - rule_set:
            - 推送服务-IP
            - 大陆相关-IP
            - 私有网络-IP
          server: direct-dns
        - clash_mode: 规则模式-我不免流-混合模式
          server: fakedns
          rewrite_ttl: 0
          disable_cache: true
        - match_all: true
          server: proxy-nm
      allow_fallthrough: true
      server: outbound-unknown
    - clash_mode:
        - 规则模式-我要免流-混合模式
        - 规则模式-我要免流-RedirHost
        - 规则模式-我要免流-FakeIP
      fallback_rules:
        - rule_set:
            - 推送服务-IP
            - 大陆相关-IP
            - 私有网络-IP
          accept_result: true
        - clash_mode: 规则模式-我要免流-混合模式
          server: fakedns
          rewrite_ttl: 0
          disable_cache: true
        - match_all: true
          server: proxy-ml
      allow_fallthrough: true
      server: domestic-dns
    - clash_mode:
        - 规则模式-我不免流-混合模式
        - 规则模式-我不免流-RedirHost
        - 规则模式-我不免流-FakeIP
      fallback_rules:
        - rule_set:
            - 推送服务-IP
            - 大陆相关-IP
            - 私有网络-IP
          accept_result: true
        - clash_mode: 规则模式-我不免流-混合模式
          server: fakedns
          rewrite_ttl: 0
          disable_cache: true
      server: proxy-nm
    - clash_mode:
        - 规则模式-我要免流-混合模式
        - 规则模式-我要免流-RedirHost
        - 规则模式-我要免流-FakeIP
      fallback_rules:
        - rule_set:
            - 推送服务-IP
            - 大陆相关-IP
            - 私有网络-IP
          accept_result: true
        - clash_mode: 规则模式-我要免流-混合模式
          server: fakedns
          rewrite_ttl: 0
          disable_cache: true
      server: proxy-ml
  lazy_cache: true
  reverse_mapping: true
  mapping_override: true
  independent_cache: true
inbounds:
  - tag: mixed
    type: mixed
    listen: '::'
    listen_port: 12306
    sniff: true
    sniff_override_destination: true
    sniff_override_rules:
      - type: logical
        mode: and
        rules:
          - domain_keyword: .
          - rule_set:
              - 跳过覆写
              - 路由后台-域名
              - 私有网络-域名
              - 推送服务-IP
              - 推送服务-域名
            invert: true
    notice: >-
      安全提示：listen 是 :: ，同一 Wi-Fi 下任何设备都能免密码使用这个代理。
      只给本机用请改成 127.0.0.1；要共享又想要密码，就在本入站加
      users: [{username: 用户名, password: 密码}]。
  - enabled: false
    tag: tproxy
    type: tproxy
    listen: '::'
    listen_port: 10086
    sniff: true
    sniff_override_destination: true
    sniff_override_rules:
      - type: logical
        mode: and
        rules:
          - domain_keyword: .
          - rule_set:
              - 跳过覆写
              - 路由后台-域名
              - 私有网络-域名
              - 推送服务-IP
              - 推送服务-域名
            invert: true
  - enabled: true
    tag: tun
    type: tun
    interface_name: tun1
    address:
      - 172.18.0.1/16
      - fdfe:dcba:9876::1/126
    strict_route: true
    auto_route: true
    route_exclude_address:
      - 169.254.0.0/16
      - 224.0.0.0/4
      - 255.255.255.255/32
      - fe80::/10
      - ff00::/8
    stack: system
    sniff: true
    sniff_override_destination: true
    sniff_override_rules:
      - type: logical
        mode: and
        rules:
          - domain_keyword: .
          - rule_set:
              - 跳过覆写
              - 路由后台-域名
              - 私有网络-域名
              - 推送服务-IP
              - 推送服务-域名
            invert: true
    notice: >-
      route_exclude_address 只排掉「组播 / 广播 / 链路本地」，这些是 mDNS(5353)、SSDP(1900)、
      DHCP、NDP 走的地址，进了 tun 就等于被黑洞，投屏 / AirPlay / DLNA / 打印机发现全废。
      刻意不排 192.168.0.0/16、10.0.0.0/8：网关 DNS(192.168.1.1:53) 必须继续进 tun
      才能被下面第一条路由规则劫持，否则 FakeIP 整体失效。局域网单播流量由
      route.rules 里的「保留地址直连」那条送去直连，效果一样但不牺牲 DNS 劫持。
outbounds:
  - tag: 本机直连
    type: direct
  - tag: 流量拦截
    type: block
  - tag: 域名解析
    type: dns
  - tag: 大厂羊毛
    type: http
    server: cloudnproxy.n.shifen.com
    server_port: 443
    headers:
      X-T5-Auth: '683556433'
      Host: 153.3.236.22:443
    notice: http 出站只承载 TCP。选它当国内出口时 UDP/QUIC 不通，配合下面那条 quic 拦截规则用
  - tag: 国外出口
    type: selector
  - tag: 国内出口
    type: selector
    interrupt_exist_connections: true
    outbounds: 本机直连
    notice: >-
      免流节点通常是 type: http，只承载 TCP。所以下面 route.rules 里把国内流量
      拆成了 network: tcp（走这里）和不带 network（走「国内UDP出口」）两条。
      在面板里给本出站挂免流节点即可，UDP 不会再撞过来。
  - tag: 国内UDP出口
    type: selector
    interrupt_exist_connections: true
    outbounds: 本机直连
    notice: >-
      国内 UDP 专用出口，默认兜底「本机直连」——不免流但保证微信语音 / 手游 / QUIC 可用。
      有支持 UDP 的国内节点（vmess / hysteria2 / tuic 等）就在面板里挂到这里；
      没有就保持直连。切勿挂 type: http 的免流节点，那样 UDP 一样会被关。
  - tag: 全局代理
    type: selector
    providers: all
