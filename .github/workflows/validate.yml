name: 校验配置

on:
  push:
    paths:
      - 'sfm/**'
      - 'tools/**'
      - 'module.prop'
      - 'UPSTREAM_SHA256.txt'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install pyyaml==6.0.2

      - name: 校验 baseConfig.yaml
        run: python3 tools/validate_baseconfig.py sfm/src/baseConfig.yaml tools/kernel_fields.txt

      - name: 核对原作者文件未被改动
        run: sha256sum -c UPSTREAM_SHA256.txt

      - name: 校验仓库路径完整性
        run: python3 tools/check_package.py --repo .

      - name: 核对必需空目录已被 git 跟踪
        run: |
          # git 不跟踪空目录 —— 必须靠 .gitkeep 占位，
          # 否则 zip 里会缺 sfm/src/log/，全新安装时 service.sh:88 重定向失败
          fail=0
          for f in sfm/src/log/.gitkeep sfm/ProxyProviders/.gitkeep; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "  OK  $f 已跟踪"
            else
              echo "::error::$f 未被 git 跟踪 —— zip 会缺这个目录"
              fail=1
            fi
          done
          exit $fail

      - name: 校验本地规则集 JSON
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = 0
          for p in sorted(pathlib.Path('sfm/RuleProviders').glob('*.json')):
              try:
                  d = json.loads(p.read_text(encoding='utf-8'))
                  assert d.get('version') == 1, 'version 必须为 1'
                  assert isinstance(d.get('rules'), list) and d['rules'], 'rules 不能为空'
                  n = sum(len(v) if isinstance(v, list) else 1
                          for r in d['rules'] for v in r.values())
                  print(f'  OK  {p.name}  ({n} 条目)')
              except Exception as e:
                  print(f'  ERR {p.name}: {e}')
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: 校验预置 srs 文件格式与完整性
        run: |
          python3 - <<'PY'
          import glob, os, sys, yaml
          # 1. 格式：内核只认 SRS v1 / v2
          bad = []
          for p in sorted(glob.glob('sfm/RuleProviders/*.srs')):
              d = open(p, 'rb').read(4)
              if d[:3] != b'SRS':
                  bad.append((p, 'magic 错误'))
              elif d[3] not in (1, 2):
                  bad.append((p, f'不支持的 version {d[3]}'))
          # 2. 完整性：每个 rule_set 都要有对应的落盘文件，
          #    这样首次启动不联网也能起来（否则 initial rule-set 失败、内核起不来）
          cfg = yaml.safe_load(open('sfm/src/baseConfig.yaml'))
          miss = []
          for r in cfg['route']['rule_set']:
              p = 'sfm/RuleProviders/' + os.path.basename(r['path'])
              if not os.path.exists(p):
                  miss.append(f"{r['tag']} → {p}")
          print(f"预置 .srs {len(glob.glob('sfm/RuleProviders/*.srs'))} 个")
          if bad:
              print('❌ 格式异常:')
              for p, why in bad:
                  print(f'  - {p}: {why}')
          if miss:
              print('❌ rule_set 缺少预置文件（首启需联网，节点未配好会导致内核起不来）:')
              for m in miss:
                  print('  -', m)
          sys.exit(1 if (bad or miss) else 0)
          PY

      - name: 探测远程规则源可用性
        run: |
          python3 - <<'PY'
          import yaml, urllib.request, ssl, sys
          ctx = ssl.create_default_context()
          cfg = yaml.safe_load(open('sfm/src/baseConfig.yaml'))
          bad = []
          for r in cfg['route']['rule_set']:
              if r.get('type') != 'remote':
                  continue
              url, code = r['url'], 0
              for _ in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'curl/8'})
                      resp = urllib.request.urlopen(req, timeout=30, context=ctx)
                      data = resp.read()
                      code = resp.status
                      ver = data[3] if data[:3] == b'SRS' else '?'
                      print(f'  OK  SRSv{ver} {len(data):>8}B  {r["tag"]}')
                      break
                  except urllib.error.HTTPError as e:
                      code = e.code
                      break
                  except Exception:
                      pass
              if code != 200:
                  print(f'  BAD http={code}  {r["tag"]}  {url}')
                  bad.append(r['tag'])
          if bad:
              print()
              print('失效的规则源:', bad)
              sys.exit(1)
          PY
